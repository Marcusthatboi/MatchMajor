version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6-alpine
    container_name: matchmajor-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: matchmajor
      MONGO_INITDB_ROOT_PASSWORD: matchmajor_password
      MONGO_INITDB_DATABASE: matchmajor
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - matchmajor-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/matchmajor -u matchmajor -p matchmajor_password
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend
    container_name: matchmajor-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://matchmajor:matchmajor_password@mongodb:27017/matchmajor
      PORT: 5000
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./server:/app
      - ./config:/app/../config
      - ./controllers:/app/../controllers
      - ./routes:/app/../routes
      - ./middleware:/app/../middleware
      - ./models:/app/../models
      - /app/node_modules
    networks:
      - matchmajor-network
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev.frontend
    container_name: matchmajor-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      NODE_ENV: development
    depends_on:
      - backend
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - /app/node_modules
    networks:
      - matchmajor-network
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_config:

networks:
  matchmajor-network:
    driver: bridge
