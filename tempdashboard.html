<!DOCTYPE html>
<html lang="en" data-auto-load-navbar="true">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MatchMajor – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./components/UI/navbar-styles.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00aabb;
      --cyan-dark: #2f6f63;
      --cyan-light: #b2f0f5;
      --gold: #f9c846;
      --text-dark: #000000;
      --text-mid: #2c4a5a;
      --white: #ffffff;
      --bg: #f0fafb;
      --shadow-card: 0 6px 24px rgba(0,160,180,0.18);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3rem);
      text-align: center;
      color: var(--text-dark);
      margin-bottom: 3rem;
      letter-spacing: -0.5px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .dashboard-card {
      background: var(--white);
      border: 3px solid var(--cyan-dark);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: var(--shadow-card);
      text-align: center;
      text-decoration: none;
      color: var(--text-dark);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .dashboard-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 40px rgba(0,160,180,0.28);
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      color: var(--cyan-dark);
      margin-bottom: 0.5rem;
    }

    .card-description {
      font-size: 0.9rem;
      color: var(--text-mid);
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      main { padding: 1.5rem 1rem; }
      h1 { font-size: 1.8rem; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
  </style>
</head> 
<body>

<div id="navbar-container"></div>

<main>
  <h1>Dashboard</h1>

  <div class="dashboard-grid">
    <a href="./Roommate Page/roommate.html" class="dashboard-card">
      <div class="card-icon">👥</div>
      <div class="card-title">Find a Roommate</div>
      <div class="card-description">Browse and connect with potential roommates on campus</div>
    </a>

    <a href="./Study Group Page/studygroup.html" class="dashboard-card">
      <div class="card-icon">📚</div>
      <div class="card-title">Study Groups</div>
      <div class="card-description">Join study groups and find collaborative learning partners</div>
    </a>
  </div>
</main>

<script src="./components/UI/navbar-loader.js"></script>
</body>
</html>
