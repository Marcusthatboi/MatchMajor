<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MatchMajor</title>
    <link rel="stylesheet" href="tempsignup.css">
    <link rel="stylesheet" href="../components/UI/navbar-styles.css"/>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>


<body>

    <nav id="main-navbar">
        <a href="#" class="nav-brand">
            <span class="plus-icon">+</span>
            MatchMajor
        </a>
        <div class="nav-right">
            <a href="../tempdashboard.html" class="btn-dashboard">Dashboard</a>
            <a href="../Profile Page/my-profile.html" class="avatar-icon">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
            </a>
        </div>
    </nav>

        <div class="wrapper">
        <form action="">
          <h1>Sign Up</h1>

           <div class="input-box">
                <input type="text" placeholder="Enter Full Name" required>
                <i class="bx bx-contact-book" ></i>
            </div>

             <div class="input-box">
                <input type="text" placeholder="Enter Email" required>
                <i class='bx bx-envelope' ></i>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Create Username" required>
                <i class='bx bx-user'></i>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Create Password" required>
                <i class='bx bx-lock-alt'></i>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Enter cell phone number" required>
                <i class="bx bx-phone" ></i>
            </div>

            <button type="submit" class="btn">Sign Up</button>

            <div class="login-link">
                <p>Already have an account? <a href="templogin.html">Login</a></p>
            </div>
        </form>
    </div>

</body>
