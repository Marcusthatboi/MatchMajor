version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: matchmajor-db-prod
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-matchmajor}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me_in_production}
      MONGO_INITDB_DATABASE: matchmajor
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - matchmajor-network
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin -u ${MONGO_USER:-matchmajor} -p ${MONGO_PASSWORD:-change_me_in_production}
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API & Frontend Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchmajor-app-prod
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER:-matchmajor}:${MONGO_PASSWORD:-change_me_in_production}@mongodb:27017/matchmajor?authSource=admin
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here_change_in_production}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - matchmajor-network
    restart: always

volumes:
  mongodb_data:
  mongodb_config:

networks:
  matchmajor-network:
    driver: bridge
